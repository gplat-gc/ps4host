<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gplat_GC // هاست PS4 — دانلود کش</title>
<link rel="icon" type="image/png" href="../pspulse.png">
<style>
:root {
    --bg:   #0c0900;
    --card: #131005;
    --cardh:#1a1508;
    --line: #3a2f10;
    --lineb:#5a4820;
    --tx:   #ffb81c;
    --tx2:  #ffd24d;
    --mu:   #c8962a;
    --dim:  #6a5215;
    --gr:   #34d399;
    --rd:   #ef4444;
    --warn: #f97316;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
html, body { min-height: 100%; }
body {
    background:
        radial-gradient(circle at 80% 0%,   #ffb81c1c, transparent 50%),
        radial-gradient(circle at 10% 100%, #ffb81c0e, transparent 45%),
        var(--bg);
    color: var(--tx);
    display: flex;
    flex-direction: column;
    font-family: Tahoma, Vazirmatn, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow: hidden;
}
a { color: inherit; }

.app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 0 14px 24px; width: min(100%, 680px); }

/* ─── Bar ─── */
.bar {
    align-items: center;
    background: #100d02;
    border: 1px solid var(--line);
    border-top: 3px solid var(--tx);
    border-radius: 0 0 12px 12px;
    display: flex;
    font-size: 13px;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 10px 16px;
}
.bar-brand { color: var(--tx2); filter: drop-shadow(0 0 7px #ffb81c88); font-size: 17px; font-weight: 700; }
.bar-right  { color: var(--mu); font-size: 12px; }

/* ─── Layout ─── */
.layout { display: flex; flex: 1 0 auto; flex-direction: column; gap: 16px; justify-content: center; }

.page-kicker { color: var(--mu); font-size: 12px; letter-spacing: .12em; margin-bottom: 6px; text-transform: uppercase; }
h1 { color: var(--tx2); font-size: clamp(24px,4vw,38px); font-weight: 700; line-height: 1.1; margin: 0 0 6px; }
h1 em { font-style: normal; }
.boot { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
.boot li { background: #1a1508; border: 1px solid var(--line); border-radius: 8px; color: var(--gr); font-size: 12px; padding: 3px 10px; }
.boot li.pending { color: var(--warn); }

/* ─── Progress ─── */
.progress-container {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
}
.progress-label {
    border-bottom: 1px solid var(--line);
    color: var(--tx);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 16px;
}
.progress-wrapper { padding: 12px 14px 14px; }
.progress-bar {
    background: #0a0800;
    border: 1px solid var(--lineb);
    border-radius: 10px;
    height: 60px;
    overflow: hidden;
    position: relative;
}
.progress-fill {
    background: linear-gradient(90deg, #7a4800, var(--tx));
    box-shadow: 0 0 14px #ffb81c55;
    height: 100%;
    transition: width .3s ease;
    width: 0;
}
.progress-text {
    color: var(--tx2);
    font-size: 20px;
    font-weight: 700;
    left: 50%;
    position: absolute;
    text-shadow: 0 1px 8px rgba(0,0,0,.9);
    top: 50%;
    transform: translate(-50%,-50%);
    z-index: 3;
}
.status-message { color: var(--mu); font-size: 13px; margin-top: 10px; font-family: Consolas, monospace; }

/* ─── Footer ─── */
.foot { border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; padding: 12px 4px 2px; text-align: center; margin-top: auto; }
.foot a { color: var(--mu); text-decoration: none; }
.foot a:hover { color: var(--tx); }

@media (max-width: 600px) {
    .app { padding: 0 10px 20px; }
    h1 { font-size: 26px; }
    .progress-bar { height: 54px; }
}
</style>
</head>
<body>
<div class="app">

    <header class="bar">
        <span class="bar-brand">🎮 Gplat_GC</span>
        <span class="bar-right">دانلود کش آفلاین</span>
    </header>

    <main class="layout">

        <div>
            <p class="page-kicker">PS4 HOST // OFFLINE CACHE</p>
            <h1>در حال دانلود <em>کش آفلاین</em></h1>
            <ul class="boot">
                <li>✓ SlopKit آماده</li>
                <li class="pending">⟳ دانلود فایل‌های هاست</li>
            </ul>
        </div>

        <section class="progress-container">
            <div class="progress-label" id="progress">لطفاً صبر کنید...</div>
            <div class="progress-wrapper">
                <div class="progress-bar" id="myProgress">
                    <div class="progress-fill" id="myBar"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div class="status-message">در حال راه‌اندازی سیستم کش...</div>
            </div>
        </section>

        <footer class="foot">
            Author: <a href="https://t.me/sudoBlackArch">BlackArch</a> // Telegram: <a href="https://t.me/PlayStation_Pulse">PlayStation Pulse</a>
        </footer>

    </main>
</div>

<script>
(function () {
    var cache = window.applicationCache;
    var progress = document.getElementById("progress");
    var bar = document.getElementById("myBar");
    var progressText = document.getElementById("progressText");
    var redirected = false;

    function storageSet(value) {
        try { localStorage.setItem("is1352Cached", value ? "true" : "false"); }
        catch (error) {}
    }
    function show(message) {
        if (progress) progress.textContent = message;
    }
    function returnToHost(delay) {
        if (redirected) return;
        redirected = true;
        setTimeout(function () { window.location.replace("index.html"); }, delay);
    }

    if (!cache || !document.documentElement.hasAttribute("manifest")) {
        show("Application cache is unavailable. Returning to host...");
        returnToHost(1500);
        return;
    }

    cache.addEventListener("downloading", function () {
        show("Page caching started...");
        storageSet(false);
    }, false);
    cache.addEventListener("progress", function (event) {
        if (!event || !(event.total > 0)) return;
        var percent = Math.round(100 * event.loaded / event.total);
        if (bar) bar.style.width = percent + "%";
        if (progressText) progressText.textContent = percent + "%";
    }, false);
    cache.addEventListener("cached", function () {
        show("Page cached successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("updateready", function () {
        try { cache.swapCache(); } catch (error) {}
        show("Cache updated successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("noupdate", function () {
        storageSet(true);
        returnToHost(250);
    }, false);
    cache.addEventListener("error", function () {
        storageSet(false);
        show("Cache failed. Returning to online host...");
        returnToHost(1500);
    }, false);
    cache.addEventListener("obsolete", function () {
        storageSet(false);
        show("Cache is obsolete. Clear browser data and reopen the host.");
    }, false);

    if (cache.status === cache.UPDATEREADY) {
        try { cache.swapCache(); } catch (error) {}
        storageSet(true);
        returnToHost(250);
    } else if (cache.status === cache.IDLE) {
        try { cache.update(); } catch (error) { returnToHost(750); }
    }
}());
</script>
