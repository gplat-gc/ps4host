<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gplat_GC // اجرای کپی‌خور — 13.02-13.52</title>
<link rel="icon" type="image/png" href="../pspulse.png">
<style>
:root {
    --bg:   #0c0900;
    --card: #131005;
    --line: #3a2f10;
    --lineb:#5a4820;
    --tx:   #ffb81c;
    --tx2:  #ffd24d;
    --mu:   #c8962a;
    --dim:  #6a5215;
    --gr:   #34d399;
    --rd:   #ef4444;
    --warn: #f97316;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
html, body { min-height: 100%; }
body {
    background:
        radial-gradient(circle at 80% 0%,   #ffb81c14, transparent 50%),
        radial-gradient(circle at 10% 100%, #ffb81c0a, transparent 45%),
        var(--bg);
    color: var(--tx);
    font-family: Tahoma, Vazirmatn, sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow: hidden;
}

.app { margin: 0 auto; padding: 0 14px 14px; width: min(100%, 680px); }

/* ─── Bar ─── */
.bar {
    align-items: center;
    background: #100d02;
    border: 1px solid var(--line);
    border-top: 3px solid var(--tx);
    border-radius: 0 0 12px 12px;
    display: flex;
    font-size: 13px;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 10px 16px;
}
.bar-brand { color: var(--tx2); filter: drop-shadow(0 0 7px #ffb81c88); font-size: 17px; font-weight: 700; }
.bar-right  { color: var(--mu); font-size: 12px; }

/* ─── State ─── */
#state {
    color: var(--tx);
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
    min-height: 28px;
}
.ok   { color: var(--gr) !important; }
.bad  { color: var(--rd) !important; }
.warn { color: var(--warn) !important; }

/* ─── Log output — JS scrolls this, keep height+overflow ─── */
#out {
    background: #080600;
    border: 1px solid var(--lineb);
    border-radius: 12px;
    color: var(--mu);
    direction: ltr;
    font: 13px/1.45 Consolas, "Liberation Mono", monospace;
    height: calc(100vh - 140px);
    overflow-y: auto;
    padding: 12px 14px;
    text-align: left;
    white-space: pre-wrap;
}

@media (max-width: 600px) {
    .app { padding: 0 10px 10px; }
    #state { font-size: 17px; }
    #out { height: calc(100vh - 120px); font-size: 12px; }
}
</style>
</head>
<body>
<div class="app">

    <header class="bar">
        <span class="bar-brand">🎮 Gplat_GC</span>
        <span class="bar-right">اجرای زنجیره SlopKit</span>
    </header>

    <div id="state">در حال بارگذاری کپی‌خور...</div>
    <div id="out"></div>

</div>
<script type="module">import "./jb.js";</script>
<script>
// PSPULSE: bounded auto-reload when the primitive gives up.
// Repeated placement misses mean this page-load heap layout does not suit
// the groom, and only a fresh load reshuffles it. The chain reports ceiling
// exhaustion as "attempt-ceiling" in the visible log; on sight, reload up
// to 2 times, then stop and leave the failure visible for manual retry.
// The budget write must verifiably persist, otherwise a broken
// sessionStorage would loop forever -- fail closed instead.
// Upstream jb.js / core.js logic is NOT otherwise modified.
(function () {
    var KEY = "pspulse-1352-reloads";
    var MAX = 2;
    var WINDOW_MS = 10 * 60 * 1000;
    var handled = false;
    function readBudget() {
        var rec = null;
        try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
        var now = Date.now();
        if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
        return rec;
    }
    function spendBudget() {
        var rec = readBudget();
        rec.n++;
        rec.t = Date.now();
        try {
            sessionStorage.setItem(KEY, JSON.stringify(rec));
            var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (check && check.n === rec.n) return rec;
        } catch (e) {}
        return null;
    }
    function successSeen(txt) {
        var lines = txt.split("\n");
        for (var i = lines.length - 1; i >= 0; i--) {
            if (lines[i].indexOf("PAYLOAD-RUNNING") !== -1) {
                return lines[i].indexOf("PROOF-OK") === 0;
            }
        }
        return false;
    }
    setInterval(function () {
        try {
            if (handled) return;
            var st = document.getElementById("state");
            var out = document.getElementById("out");
            var txt = out ? out.textContent : "";
            if (successSeen(txt)) {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                handled = true;
                return;
            }
            if (!st || st.textContent !== "threw") return;
            if (txt.indexOf("attempt-ceiling") === -1) return;
            handled = true;
            var rec = spendBudget();
            if (!rec || rec.n > MAX) return;
            st.textContent = "heap layout missed -- reloading for a fresh heap (" + rec.n + "/2)...";
            st.className = "warn";
            setTimeout(function () { location.reload(); }, 2000);
        } catch (e) { /* never break the exploit page */ }
    }, 3000);
})();
</script>
</body>
</html>
