<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.manifest">
<head>
    <link rel="icon" type="image/png" href="../pspulse.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گیم سنتر جی پلات // 11.00-13.00 POOPS</title>
<style>
    :root {
        --bg:   #0c0900;
        --card: #131005;
        --cardh:#1a1508;
        --line: #3a2f10;
        --lineb:#5a4820;
        --tx:   #ffb81c;
        --tx2:  #ffd24d;
        --mu:   #c8962a;
        --dim:  #6a5215;
        --gr:   #34d399;
        --rd:   #ef4444;
        --warn: #f97316;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background:
            radial-gradient(circle at 80% 0%, #ffb81c1c, transparent 50%),
            radial-gradient(circle at 10% 100%, #ffb81c0e, transparent 45%),
            var(--bg);
        color: var(--tx);
        font: 16px/1.45 Tahoma, Vazirmatn, sans-serif;
        min-height: 100vh;
        overflow-y: auto;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* هدر بار */
    .bar {
        background: #100d02;
        border: 1px solid var(--line);
        border-top: 3px solid var(--tx);
        border-radius: 0 0 12px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        margin-bottom: 0;
        font-size: 14px;
    }
    .bar-brand {
        color: var(--tx2);
        font-weight: 700;
        font-size: 15px;
        filter: drop-shadow(0 0 6px #ffb81c88);
    }
    .bar-chain { color: var(--mu); font-size: 13px; }

    #state { color: var(--tx); font-size: 20px; font-weight: 700; line-height: 1.25; margin: 16px 0 8px; }
    .ok   { color: var(--gr) !important; }
    .bad  { color: var(--rd) !important; }
    .warn { color: var(--warn) !important; }

    /* لاگ جیلبریک */
    #out {
        background: #080600;
        border: 1px solid var(--lineb);
        border-radius: 12px;
        color: var(--tx2);
        font: 13px/1.45 Consolas, "Liberation Mono", monospace;
        direction: ltr;
        text-align: left;
        height: calc(100vh - 140px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    /* باکس مهم */
    .note {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 18px;
        margin-top: 14px;
        font-size: 14px;
    }
    .note-title { color: var(--tx2); font-weight: 700; text-align: center; margin-bottom: 4px; }
    .note ul { padding-right: 20px; color: var(--tx); }
    .note li { margin: 3px 0; }
    .note li::marker { color: var(--tx2); }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 17px; margin: 12px 0 6px; }
        #out { height: calc(100vh - 120px); font-size: 12px; }
    }
</style>
</head>
<body>
    <div class="app">
        <header class="bar">
            <span class="bar-brand">🎮 Gplat_GC</span>
            <span class="bar-chain">poops chain</span>
        </header>

        <div class="note">
            <div class="note-title">مهم</div>
            <ul>
                <li>در صورتی که با خطا مواجه شدید دوباره تلاش نکنید. فقط کنسول را ری‌استارت کنید و تلاش کنید.</li>
                <li>این جیلبریک جدید و این هاست در فریمور های 11.00 تا 13.00 هیچ نیازی به فلش ندارد.</li>
                <li>گلدهن بعد از چند ثانیه به صورت اتوماتیک لود می‌شود.</li>
            </ul>
        </div>

        <div id="state">در حال بارگذاری poops chain...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
// PSPULSE: auto-reload DISABLED for poops (12.50/12.52/13.00).
// The attempt-ceiling monitor was removed here because its trigger
// (primitive "attempt-ceiling" in the log + FAILED state) persists in the
// visible log after the kernel has been touched (DOUBLE/TRIPLE-FREE).
// Reloading at that point re-enters on a dirty kernel without a reboot,
// which is a kernel-panic shape. Upstream (rawgame4 README) does manual
// reload only: a failed poops attempt means reboot, then retry.
// run_lapse.html keeps its own monitor; this file intentionally has none.
</script></body>
</html>
